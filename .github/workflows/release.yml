# Rebuilds HatRack's screenshots, guide, getting-started tour and change log on every push, checks that
# every feature is documented and every change to the app is in the change log, then publishes the
# site with GitHub Pages and records the published version in src/release-lock.json.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Build, document and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the screenshot tools
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build the app, re-take screenshots, rebuild the guide, tour and change log, check docs
        run: python release.py --publish
      - name: Save the refreshed files back to the repository
        run: |
          git config user.name "hatrack-docs"
          git config user.email "hatrack-docs@users.noreply.github.com"
          git add index.html guide.html guide guide-src/shots.json guide-src/capture-meta.json CHANGELOG.md src/release-lock.json
          git diff --cached --quiet || (git commit -m "Refresh screenshots, guide, tour and change log [skip ci]" && git push)
      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r index.html guide.html guide apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
