# Keeps HatRack's docs in step with the app on every push: re-takes the screenshots, rebuilds the
# guide, getting-started tour and change log, checks that every feature is documented and every change
# to the app is in the change log, records the version in src/release-lock.json, and commits the
# refreshed files. Vercel (vercel.json) publishes each commit to https://hatrack.mkcworkspace.com/.
name: Build, document and check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the screenshot tools
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build the app, re-take screenshots, rebuild the guide, tour and change log, check docs
        run: python release.py --publish
      - name: Save the refreshed files back to the repository (Vercel publishes them)
        run: |
          git config user.name "hatrack-docs"
          git config user.email "hatrack-docs@users.noreply.github.com"
          git add index.html guide.html guide guide-src/shots.json guide-src/capture-meta.json CHANGELOG.md src/release-lock.json
          git diff --cached --quiet || (git commit -m "Refresh screenshots, guide, tour and change log [skip ci]" && git push)
