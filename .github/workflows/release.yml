# Rebuilds HatRack's screenshots, guide and getting-started tour on every push, checks that
# every feature is documented, then publishes the site with GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Build, document and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the screenshot tools
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build the app, re-take screenshots, rebuild the guide and tour, check docs
        run: python release.py
      - name: Save the refreshed files back to the repository
        run: |
          git config user.name "hatrack-docs"
          git config user.email "hatrack-docs@users.noreply.github.com"
          git add index.html guide.html guide guide-src/shots.json guide-src/capture-meta.json
          git diff --cached --quiet || (git commit -m "Refresh screenshots, guide and tour [skip ci]" && git push)
      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r index.html guide.html guide apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
